# Cuts a GitHub Release whenever a `v*` tag is pushed.
#
# Builds bundles for Windows, macOS (arm64 + x86_64) and Linux,
# signs each with the minisign key stored in repository secrets, and
# uploads them plus the `latest.json` the Tauri updater downloads.
#
# See docs/RELEASE.md for the one-time setup of the secrets used here:
#   TAURI_SIGNING_PRIVATE_KEY
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD
#
# Optional OS-level code-signing secrets (uncomment the env: blocks below
# once the certs are in place):
#   APPLE_CERTIFICATE / APPLE_CERTIFICATE_PASSWORD / APPLE_SIGNING_IDENTITY
#   APPLE_ID / APPLE_PASSWORD / APPLE_TEAM_ID
#   WINDOWS_CERTIFICATE / WINDOWS_CERTIFICATE_PASSWORD

name: release

on:
  push:
    tags:
      - "v*"

# One release build per tag at a time. Moving a tag while a run is still
# uploading let two runs write into the same draft (run #33 failed that
# way); the newer push now cancels the older run.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

# Actions are pinned to commit SHAs (supply-chain hardening); the tag they
# were resolved from is in the trailing comment. Bump by resolving the new
# tag with `git ls-remote https://github.com/<owner>/<repo>.git refs/tags/<tag>^{}`.
jobs:
  build:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: "--target aarch64-apple-darwin"
          - platform: macos-latest
            args: "--target x86_64-apple-darwin"
          - platform: ubuntu-24.04
            args: ""
          - platform: windows-latest
            args: ""
    runs-on: ${{ matrix.platform }}

    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Install Linux build deps
        if: matrix.platform == 'ubuntu-24.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # Pinned to a SHA, so the toolchain channel must be given explicitly
      # (unpinned, the action takes it from the ref name `@stable`).
      - name: Set up Rust
        uses: dtolnay/rust-toolchain@89b12181fb390509a0842a86cc55eeb8eb928c1d # stable branch
        with:
          toolchain: stable
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2
        with:
          workspaces: ./src-tauri -> target

      # No `version:` here on purpose — `package.json`'s
      # `packageManager: "pnpm@9.12.0"` field is the source of truth.
      - name: Set up pnpm
        uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6

      - name: Set up Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5
        with:
          node-version: 22
          cache: pnpm

      - name: Install JS dependencies
        run: pnpm install --frozen-lockfile

      # Pull the matching `## [X.Y.Z]` section out of CHANGELOG.md so
      # the GitHub release page shows the actual changes — not just a
      # generic "see CHANGELOG.md" link the user has to click.
      # awk is GNU/BSD-portable; explicit `shell: bash` ensures we use
      # Git-for-Windows bash on the Windows runner instead of pwsh.
      # Falls back to a "see CHANGELOG.md" line if the section is
      # missing (forgot to update CHANGELOG before tagging) so the
      # release still publishes instead of failing the workflow.
      - name: Extract release notes from CHANGELOG
        id: notes
        shell: bash
        run: |
          set -eo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk -v target="$VERSION" '
            /^## \[/ {
              if (in_target) { exit }
              if (index($0, "[" target "]") > 0) { in_target = 1; next }
            }
            in_target { print }
          ' CHANGELOG.md)
          if [ -z "$(printf "%s" "$NOTES" | tr -d "[:space:]")" ]; then
            NOTES="Release notes are in [\`CHANGELOG.md\`](https://github.com/PPoletto/BRAIN/blob/main/CHANGELOG.md) — no \`## [$VERSION]\` section was found at tag time."
          fi
          {
            echo "body<<RELEASE_NOTES_EOF"
            echo "$NOTES"
            echo ""
            echo "---"
            echo ""
            echo "Existing BRAIN installs will see this as an available update on the next 6-hour check, or when you click the version in the status bar."
            echo "RELEASE_NOTES_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Build, sign, upload
        uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          # Apple notarisation — uncomment after acquiring the Developer ID
          # APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          # APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          # APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY }}
          # APPLE_ID: ${{ secrets.APPLE_ID }}
          # APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          # APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "BRAIN ${{ github.ref_name }}"
          releaseBody: ${{ steps.notes.outputs.body }}
          releaseDraft: true
          prerelease: false
          # tauri.conf.json lists the bundle targets explicitly (NSIS, no
          # MSI). Belt-and-suspenders: should a future change re-enable MSI,
          # latest.json still references the NSIS bundle we ship and sign.
          updaterJsonPreferNsis: true
          args: ${{ matrix.args }}
