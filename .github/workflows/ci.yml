# Lint + test on every push to main and every PR. Keeps the
# `cargo clippy --all-targets -- -D warnings`, `cargo test`,
# `pnpm lint`, `pnpm exec tsc --noEmit`, `pnpm test` gates green so
# release tags can be cut without surprise.

name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  rust:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5

      - name: Install Linux build deps
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libgtk-3-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            libssl-dev \
            patchelf

      # `tauri::generate_context!()` validates `frontendDist` (= `../dist`)
      # exists at compile time. The Rust job therefore needs the frontend
      # built before `cargo clippy`/`cargo test` — without it the proc
      # macro panics with "path doesn't exist".
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target

      - name: clippy
        working-directory: src-tauri
        run: cargo clippy --all-targets -- -D warnings
      - name: test
        working-directory: src-tauri
        run: cargo test --workspace

  frontend:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      # NOTE: no `version:` here on purpose — `package.json`'s
      # `packageManager: "pnpm@9.12.0"` field is the source of truth and
      # the action picks it up via Corepack. Specifying both produced
      # `ERR_PNPM_BAD_PM_VERSION`.
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm test
